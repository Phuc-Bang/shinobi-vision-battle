<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shinobi Vision Battle - Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="menu-screen">
    <div class="menu-backdrop"></div>
    <div class="menu-panel">
      <h1 class="menu-title">SHINOBI VISION BATTLE</h1>
      <p class="menu-subtitle">Naruto vs Mizuki • 2D Vision Fighter</p>
      <div class="menu-selects">
        <label class="menu-select">
          <span>Nhân vật của bạn</span>
          <select id="home-player">
            <option value="naruto">Naruto</option>
            <option value="mizuki">Mizuki</option>
          </select>
        </label>
        <label class="menu-select">
          <span>Đối thủ</span>
          <select id="home-bot">
            <option value="mizuki">Mizuki</option>
            <option value="naruto">Naruto</option>
          </select>
        </label>
        <label class="menu-select">
          <span>Bản đồ</span>
          <select id="home-map">
            <option value="arena">Arena</option>
          </select>
        </label>
      </div>
      <div class="menu-actions">
        <button id="home-start" class="menu-btn primary">Vào Trận</button>
        <a class="menu-btn" href="game.html">Vào Nhanh</a>
      </div>
      <div class="menu-footnote">Trang game riêng: <code>game.html</code></div>
    </div>
  </div>

  <script>
    const player = document.getElementById("home-player");
    const bot = document.getElementById("home-bot");
    const map = document.getElementById("home-map");
    const startBtn = document.getElementById("home-start");

    function keepDifferent(changed) {
      if (player.value === bot.value) {
        if (changed === "player") {
          bot.value = player.value === "naruto" ? "mizuki" : "naruto";
        } else {
          player.value = bot.value === "naruto" ? "mizuki" : "naruto";
        }
      }
    }

    player.addEventListener("change", () => keepDifferent("player"));
    bot.addEventListener("change", () => keepDifferent("bot"));

    startBtn.addEventListener("click", () => {
      const q = new URLSearchParams({
        player: player.value,
        bot: bot.value,
        map: map.value
      });
      window.location.href = `game.html?${q.toString()}`;
    });
  </script>
</body>
</html>
