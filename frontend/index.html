<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shinobi Vision Battle - Naruto vs Mizuki</title>
    <!-- Import Font Google: Poppins cho text dễ đọc và Press Start 2P cho tiêu đề game -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Thư viện SocketIO Client -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <!-- KHU VỰC AUDIO: Chuẩn bị sẵn các thẻ âm thanh (src sẽ được điền sau) -->
    <div id="audio-container" style="display:none;">
        <audio id="bgm" loop></audio> <!-- Nhạc nền -->
        <audio id="sfx-rasengan"></audio>
        <audio id="sfx-shuriken"></audio>
        <audio id="sfx-kage"></audio>
        <audio id="sfx-kunai"></audio>
        <audio id="sfx-win"></audio>
        <audio id="sfx-lose"></audio>
    </div>

    <!-- KHUNG CHỨA TOÀN BỘ GAME -->
    <div class="game-container">
        
        <!-- BÊN TRÁI: CAMERA VÀ ĐIỀU KHIỂN (60%) -->
        <div class="left-panel">
            <!-- Khu vực Camera và Khung xương -->
            <div class="video-container">
                <video id="webcam" autoplay playsinline muted></video>
                <!-- Canvas vẽ các điểm xương khớp tay đè lên video -->
                <canvas id="skeleton-overlay"></canvas>
            </div>
            
            <!-- Khu vực Nút bấm điều khiển -->
            <div class="controls-container">
                <button id="btn-toggle-story" class="btn ninja-btn">📜 Xem Cốt Truyện</button>
                <button id="btn-reset" class="btn ninja-btn danger">🔄 Chơi Lại</button>
            </div>
            
            <!-- Hướng dẫn cử chỉ phòng thủ -->
            <div class="defense-guide" style="display: flex; justify-content: center; gap: 20px; margin-top: 10px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px;">
                <div style="text-align: center; font-size: 0.8rem;">
                    <img src="assets/images/icon_block.png" style="width: 40px; height: 40px;" alt="Block">
                    <div>Tay chéo (Block)</div>
                </div>
                <div style="text-align: center; font-size: 0.8rem;">
                    <img src="assets/images/icon_dodge.png" style="width: 40px; height: 40px;" alt="Dodge">
                    <div>Nghiêng người (Dodge)</div>
                </div>
            </div>

            <!-- Khung hiển thị Cốt truyện (ẩn mặc định) -->
            <div id="story-content" class="story-box hidden">
                <p>Nội dung cốt truyện sẽ hiện ở đây...</p>
            </div>
        </div>

        <!-- BÊN PHẢI: THÔNG SỐ VÀ KỸ NĂNG (35%) -->
        <div class="right-panel">
            <h1 class="game-title">SHINOBI BATTLE</h1>
            
            <!-- KHU VỰC THANH MÁU (HP) -->
            <div class="health-board">
                <!-- Thanh máu Naruto (Người chơi) -->
                <div class="character-stats">
                    <div class="char-info">
                        <img src="assets/images/avatar_naruto.png" class="avatar-img" alt="Naruto">
                        <span class="name">NARUTO (Player)</span>
                    </div>
                    <div class="health-bar-bg">
                        <div id="player-hp-fill" class="health-fill player-hp"></div>
                        <span id="player-hp-text" class="hp-text">100/100</span>
                    </div>
                </div>

                <!-- Thanh máu Mizuki (Boss) -->
                <div class="character-stats">
                    <div class="char-info">
                        <img src="assets/images/avatar_mizuki.png" class="avatar-img" alt="Mizuki">
                        <span class="name">MIZUKI (Boss)</span>
                    </div>
                    <div class="health-bar-bg">
                        <div id="enemy-hp-fill" class="health-fill enemy-hp"></div>
                        <span id="enemy-hp-text" class="hp-text">100/100</span>
                    </div>
                </div>
            </div>

            <!-- KHU VỰC KỸ NĂNG (SKILLS) -->
            <div class="skills-board">
                <!-- Skill Kage Bunshin -->
                <div class="skill" id="skill-kage">
                    <img src="assets/images/skill_kagebunshin.png" class="skill-icon-img" alt="Kage Bunshin">
                    <div class="skill-name">Kage Bunshin</div>
                    <!-- Lớp phủ mờ hiển thị đếm ngược Cooldown -->
                    <div id="cooldown-kage" class="cooldown-overlay hidden">0.0</div>
                </div>
                
                <!-- Skill Rasengan -->
                <div class="skill" id="skill-rasengan">
                    <img src="assets/images/skill_rasengan.png" class="skill-icon-img" alt="Rasengan">
                    <div class="skill-name">Rasengan</div>
                    <div id="cooldown-rasengan" class="cooldown-overlay hidden">0.0</div>
                </div>
                
                <!-- Skill Rasenshuriken -->
                <div class="skill" id="skill-shuriken">
                    <img src="assets/images/skill_rasenshuriken.png" class="skill-icon-img" alt="Rasenshuriken">
                    <div class="skill-name">Rasenshuriken</div>
                    <div id="cooldown-shuriken" class="cooldown-overlay hidden">0.0</div>
                    <!-- Số lần sử dụng còn lại -->
                    <div id="shuriken-count" class="skill-count">3/3</div>
                </div>
            </div>

            <!-- KHU VỰC NHẬT KÝ CHIẾN ĐẤU (LOG) -->
            <div class="log-board">
                <h3 class="log-title">NHẬT KÝ CHIẾN ĐẤU</h3>
                <div id="log" class="log-area">
                    <!-- Các dòng Log sẽ được thêm vào đây bằng JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Script kết nối JS (Đã được viết ở Phần trước) -->
    <script src="script.js"></script>
</body>
</html>
